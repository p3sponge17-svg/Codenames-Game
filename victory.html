<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Victory - Codenames</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    html,body { height:100%; margin:0; font-family:Segoe UI,system-ui,Arial,sans-serif; }
    .full {
      position:relative;
      width:100%;
      height:100%;
      overflow:auto;
      background:#000;
      color:white;
    }
    .bg-video {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:1;
      filter:brightness(0.42);
    }
    .overlay {
      position:relative;
      z-index:2;
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      box-sizing:border-box;
    }
    .card {
      background:rgba(15, 18, 28, 0.78);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      padding:28px;
      border-radius:14px;
      text-align:center;
      max-width:920px;
      width:95%;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    }
    h1 { font-size:2.3rem; margin-bottom:8px; letter-spacing:1px; }
    p { font-size:1.05rem; margin:6px 0 14px 0; color:#e0e0e0; }
    .winners { font-weight:700; font-size:1.05rem; margin-bottom:18px; color:#f1c40f; }
    .ready-list { margin-top:12px; font-size:0.95rem; color:#e7e7e7; }
    .btn {
      display:inline-block;
      background:#27ae60;
      color:white;
      padding:12px 24px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-size:1rem;
      font-weight:bold;
      transition: background 0.2s ease;
    }
    .btn:hover:not(:disabled) { background:#2ecc71; }
    .btn:disabled { background:#7f8c8d; cursor:not-allowed; }
    .small { font-size:0.9rem; color:#ddd; margin-top:8px; }

    /* Match History & Leaderboard Styles */
    .leaderboard-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
      text-align: left;
    }
    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .leaderboard-header h2 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .series-score {
      display: flex;
      gap: 10px;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .series-badge {
      padding: 6px 14px;
      border-radius: 20px;
      color: white;
    }
    .series-badge.red { background: #e74c3c; }
    .series-badge.blue { background: #3498db; }

    .history-table-wrap {
      max-height: 220px;
      overflow-y: auto;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    table.history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.35);
    }
    table.history-table th, table.history-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    table.history-table th {
      background: rgba(255,255,255,0.12);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
    }
    .team-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .team-pill.red { background: #e74c3c; color: white; }
    .team-pill.blue { background: #3498db; color: white; }

    @media (max-width:600px) {
      h1 { font-size:1.5rem; }
      .card { padding:18px; }
    }
  </style>
</head>
<body>
  <div class="full">
    <video id="victoryVideo" class="bg-video" autoplay muted loop playsinline>
      <source id="victoryVideoSource" src="" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <div class="overlay">
      <div class="card">
        <h1 id="title">TEAM WAS VICTORIOUS!</h1>
        <p id="subtitle">Celebration message</p>
        <div class="winners" id="winners">Winners: ...</div>

        <button class="btn" id="readyBtn">Start New Game (Keep Teams)</button>
        <div class="small" id="youStatus"></div>

        <div class="ready-list" id="readyList" style="display:none;">
          Waiting for players...<br>
          <span id="readyNames"></span>
        </div>

        <!-- Session Leaderboard & Match History -->
        <div class="leaderboard-section">
          <div class="leaderboard-header">
            <h2>🏆 Session Leaderboard &amp; Match History</h2>
            <div class="series-score">
              <span class="series-badge red" id="redSeriesScore">RED WINS: 0</span>
              <span class="series-badge blue" id="blueSeriesScore">BLUE WINS: 0</span>
            </div>
          </div>

          <div class="history-table-wrap">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Round</th>
                  <th>Winning Team</th>
                  <th>How They Won</th>
                  <th>Spymaster 👑</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="4" style="text-align:center; color:#aaa;">Loading match history...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function qs() {
      const params = {};
      const parts = (location.search || '').replace(/^\?/, '').split('&').filter(Boolean);
      parts.forEach(p => {
        const [k, v] = p.split('=');
        params[decodeURIComponent(k)] = v ? decodeURIComponent(v) : '';
      });
      return params;
    }

    const params = qs();
    const reason = (params.reason || '').toLowerCase();
    const winnerTeam = (params.winner || '').toLowerCase();
    const winnersParam = params.winners || '';

    const victoryVideo = document.getElementById('victoryVideo');
    const videoSource = document.getElementById('victoryVideoSource');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const winnersEl = document.getElementById('winners');
    const readyBtn = document.getElementById('readyBtn');
    const readyListDiv = document.getElementById('readyList');
    const readyNamesSpan = document.getElementById('readyNames');
    const youStatus = document.getElementById('youStatus');

    const RED_FOUND_VIDEO  = '/videos/victory_red_found_all.mp4';
    const BLUE_FOUND_VIDEO = '/videos/victory_blue_found_all.mp4';
    const ASSASSIN_VIDEO   = '/videos/victory_assassin.mp4';

    if (reason === 'assassin') {
      videoSource.src = ASSASSIN_VIDEO;
      subtitleEl.textContent = `${winnerTeam.toUpperCase()} TEAM WAS VICTORIOUS! ${winnerTeam === 'blue' ? 'RED Team was killed by the Assassin' : 'BLUE Team was killed by the Assassin'}`;
    } else if (reason === 'foundall') {
      videoSource.src = winnerTeam === 'red' ? RED_FOUND_VIDEO : BLUE_FOUND_VIDEO;
      subtitleEl.textContent = 'All words were found!';
    } else {
      videoSource.src = BLUE_FOUND_VIDEO;
      subtitleEl.textContent = '';
    }

    titleEl.textContent = `${(winnerTeam || 'TEAM').toUpperCase()} TEAM WAS VICTORIOUS!`;
    const winnersNames = winnersParam ? winnersParam.split(',').filter(Boolean) : [];
    winnersEl.textContent = 'Winners: ' + (winnersNames.length ? winnersNames.join(', ') : 'Unknown');
    victoryVideo.load();

    // Render Match History & Leaderboard
    function renderLeaderboard(history, redWins, blueWins) {
      document.getElementById('redSeriesScore').textContent = `RED WINS: ${redWins || 0}`;
      document.getElementById('blueSeriesScore').textContent = `BLUE WINS: ${blueWins || 0}`;

      const tbody = document.getElementById('historyTableBody');
      if (!history || history.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#aaa;">No rounds recorded yet.</td></tr>';
        return;
      }

      tbody.innerHTML = history.slice().reverse().map(item => {
        const winLabel = item.reason === 'assassin' ? 'Opponent Hit Assassin 💀' : 'Found All Words 🎯';
        const teamClass = item.winner === 'red' ? 'red' : 'blue';
        const spyName = item.spymaster || (item.winner === 'red' ? item.redSpymaster : item.blueSpymaster) || 'None';
        return `
          <tr>
            <td><strong>#${item.round}</strong></td>
            <td><span class="team-pill ${teamClass}">${item.winner}</span></td>
            <td>${winLabel}</td>
            <td>${escapeHtml(spyName)}</td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    fetch('/api/history')
      .then(r => r.json())
      .then(data => renderLeaderboard(data.matchHistory, data.redWinsTotal, data.blueWinsTotal))
      .catch(() => {});

    const storedName = params.me || localStorage.getItem('codenames_playerName') || '';
    const storedTeam = params.team || localStorage.getItem('codenames_playerTeam') || null;
    if (storedName) localStorage.setItem('codenames_playerName', storedName);
    if (storedTeam) localStorage.setItem('codenames_playerTeam', storedTeam);

    const socket = io();
    let amReady = false;
    let playersState = [];

    socket.on('connect', () => {
      if (storedName) {
        socket.emit('rejoin', { name: storedName, team: storedTeam });
      }
    });

    readyBtn.addEventListener('click', () => {
      if (amReady) return;
      amReady = true;
      readyBtn.disabled = true;
      socket.emit('playerReadyNewGame', { name: storedName, team: storedTeam });
      youStatus.textContent = 'You are ready. Waiting for others...';
      readyListDiv.style.display = 'block';
    });

    function updateReadyList(players) {
      playersState = players || [];
      const readyPlayers = playersState.filter(p => p.readyNewGame);
      const pendingPlayers = playersState.filter(p => !p.readyNewGame);

      if (readyPlayers.length === 0) {
        readyNamesSpan.textContent = 'No players ready yet';
      } else {
        const readyText = readyPlayers.map(p => p.name).join(', ');
        const waitingText = pendingPlayers.length > 0
          ? ` | Still waiting on: ${pendingPlayers.map(p => p.name).join(', ')}`
          : '';
        readyNamesSpan.textContent = `${readyText} (${readyPlayers.length}/${playersState.length})${waitingText}`;
      }
      readyListDiv.style.display = (readyPlayers.length > 0 || amReady) ? 'block' : 'none';
    }

    function goBackToLobby() {
      const meParam = encodeURIComponent(storedName);
      const teamParam = encodeURIComponent(storedTeam || '');
      window.location.href = `/?nextRound=1&me=${meParam}&team=${teamParam}`;
    }

    socket.on('playerUpdate', (players) => {
      updateReadyList(players);
    });

    socket.on('gameState', (state) => {
      if (!state) return;
      if (state.players) updateReadyList(state.players);
      if (state.matchHistory) {
        renderLeaderboard(state.matchHistory, state.redWinsTotal, state.blueWinsTotal);
      }

      if (!state.gameStarted && !state.gameOver) {
        goBackToLobby();
      }
    });

    socket.on('returnToLobby', () => {
      goBackToLobby();
    });
  </script>
</body>
</html>
